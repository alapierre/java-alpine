name: Build
on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  buildx:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ["11", "17", "21", "25"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image (from jdk-${{ matrix.jdk }})
        run: |
          (cd jdk-${{ matrix.jdk }} && make build github)

  sbom_to_dt:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: buildx

    steps:
      - name: Pull image (linux/amd64) for SBOM
        run: |
          docker pull --platform=linux/amd64 lapierre/java-alpine:21

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@v0.23.0
        with:
          image: lapierre/java-alpine:21
          format: cyclonedx-json
          output-file: sbom-java-alpine-21.cdx.json

      - name: Upload SBOM to Dependency-Track
        env:
          DTRACK_URL: https://dtrack.itrust.dev
          DTRACK_API_KEY: ${{ secrets.DT_API_KEY }}
          DTRACK_PROJECT_NAME: "java-alpine:21"
          DTRACK_VERSION: ${{ github.sha }}
          DTRACK_IS_LATEST: "true"
          DTRACK_PARENT_UUID: "485c7fac-f4ac-4c5b-a692-9ba97bfc9d47"
          DTRACK_AUTO_CREATE: "true"
          DTRACK_BOM_PATH: "sbom-java-alpine-21.cdx.json"
          DTRACK_TIMEOUT_SECONDS: "60"
        run: |
          set -euo pipefail          
          curl --fail --show-error --silent \
            --max-time "$DTRACK_TIMEOUT_SECONDS" \
            -X POST "$DTRACK_URL/api/v1/bom" \
            -H "accept: application/json" \
            -H "X-Api-Key: $DTRACK_API_KEY" \
            -F "isLatest=$DTRACK_IS_LATEST" \
            -F "projectName=$DTRACK_PROJECT_NAME" \
            -F "projectVersion=$DTRACK_VERSION" \
            -F "autoCreate=$DTRACK_AUTO_CREATE" \
            -F "parentUUID=$DTRACK_PARENT_UUID" \
            -F "bom=@$DTRACK_BOM_PATH;type=application/json"